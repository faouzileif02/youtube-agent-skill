name: Skill bug
description: Report incorrect activation, workflow, validation, or output behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: yt-example
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Prompt that exposed the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
