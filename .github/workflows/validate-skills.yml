name: Validate community skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "tools/**"
      - "tests/**"
      - "community-skills.json"
      - "CATALOG.md"
      - ".github/workflows/validate-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "tools/**"
      - "tests/**"
      - "community-skills.json"
      - "CATALOG.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate skills
        run: python tools/validate_skills.py --min-score 85
      - name: Verify generated catalog
        run: python tools/build_catalog.py --check
